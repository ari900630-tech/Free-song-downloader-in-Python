name: Music Downloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'בחר פעולה: search (חיפוש בלבד) או download (הורדה)'
        required: true
        default: 'search'
        type: choice
        options:
          - search
          - download
      artist_name:
        description: 'שם הזמר או השיר'
        required: true
        type: string
      selection:
        description: 'במצב download בלבד: איזה שירים להוריד (all, 1-5, או 1,3,4)'
        required: false
        default: 'all'
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install yt-dlp

    - name: Run Search or Download
      run: |
        python download_script.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.artist_name }}" "${{ github.event.inputs.selection }}"

    - name: Upload Music Artifact
      if: github.event.inputs.mode == 'download'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.artist_name }}-MP3s
        path: music_downloads/
